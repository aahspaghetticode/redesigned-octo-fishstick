<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Eclipse</title>
  <meta name="description" content="Your personal start page." />
  <meta name="theme-color" content="#0b0b0e" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="stylesheet" href="/css/app.css" />
  <script src="/baremux/index.js" defer></script>
  <script src="/scram/scramjet.all.js" defer></script>
  <script src="/uv/uv.bundle.js" defer></script>
  <script src="/uv/uv.config.js" defer></script>
  <script src="/vendor/hls/hls.min.js" defer></script>
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/" aria-label="Eclipse home">
      <img src="/logo.svg" alt="" width="30" height="30" />
      <span>Eclipse</span>
    </a>
    <nav class="nav" aria-label="Main">
      <a href="#/" data-route="home">Home</a>
      <a href="#/browse" data-route="browse">Browse</a>
      <a href="#/games" data-route="games">Games</a>
      <a href="#/media" data-route="media">Media</a>
      <a class="nav-gear" href="#/settings" data-route="settings" title="Settings" aria-label="Settings"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg></a>
    </nav>
  </header>
  <div id="corner" aria-hidden="true"></div>

  <main id="view" tabindex="-1"></main>
  <section id="browser" class="browser" hidden>
    <div class="browser-bar">
      <button class="icon-btn" data-act="back" title="Back" aria-label="Back"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg></button>
      <button class="icon-btn" data-act="forward" title="Forward" aria-label="Forward"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></button>
      <button class="icon-btn" data-act="reload" title="Reload" aria-label="Reload"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg></button>
      <form class="address" id="address-form" autocomplete="off">
        <select class="select engine-pill" id="browser-engine" aria-label="Engine"></select>
        <input id="address" type="text" spellcheck="false" placeholder="Search or enter a URL" aria-label="Address" />
      </form>
      <button class="icon-btn" data-act="fullscreen" title="Fullscreen" aria-label="Fullscreen"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg></button>
      <button class="icon-btn" data-act="close" title="Close page" aria-label="Close page"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
      <div class="loadbar" id="loadbar"></div>
    </div>
    <div class="browser-frame" id="browser-frame"></div>
  </section>
  <div id="player" class="player" hidden>
    <div class="player-bar">
      <div class="title"><strong id="player-title"></strong><small id="player-source"></small></div>
      <span class="spacer"></span>
      <button class="btn quiet fav" data-act="fav" aria-pressed="false">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
        <span class="label">Favorite</span>
      </button>
      <button class="btn quiet" data-act="fullscreen">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
        <span class="label">Fullscreen</span>
      </button>
      <button class="icon-btn" data-act="close" title="Close (Esc)" aria-label="Close game"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
    </div>
    <div class="player-stage" id="player-stage"></div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
